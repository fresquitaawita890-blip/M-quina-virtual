name: SKYLER-JOYARK-LOGIN

on:
  workflow_dispatch:

jobs:
  joyark-setup:
    runs-on: windows-latest
    timeout-minutes: 400

    steps:
      - name: 1. Configurar Escritorio Remoto
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0

      - name: 2. Crear Usuario Skyler
        run: |
          $pass = "SkylerRDP2026!"
          $user = "Skyler"
          $securePass = ConvertTo-SecureString $pass -AsPlainText -Force
          New-LocalUser -Name $user -Password $securePass -FullName "Skyler RDP"
          Add-LocalGroupMember -Group "Administrators" -Member $user

      - name: 3. Instalar JoyArk (Modo Silencioso)
        run: |
          $url = "https://download.joyark.com/pc/JoyArk_Setup.exe"
          $outpath = "$env:TEMP\JoyArk_Setup.exe"
          Write-Host "Bajando instalador..."
          Invoke-WebRequest -Uri $url -OutFile $outpath
          Write-Host "Instalando JoyArk..."
          Start-Process -FilePath $outpath -ArgumentList "/S" -Wait
          Write-Host "Instalación completada."

      - name: 4. Conectar Tailscale
        shell: powershell
        run: |
          Invoke-WebRequest https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi -OutFile tailscale.msi
          Start-Process msiexec.exe -ArgumentList "/i", "tailscale.msi", "/quiet", "/norestart" -Wait
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }}
          $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "------------------------------------"
          Write-Host "IP PARA TU RDP: $ip"
          Write-Host "Usuario: Skyler | Pass: SkylerRDP2026!"
          Write-Host "------------------------------------"

      - name: 5. Abrir JoyArk y esperar Login
        run: |
          Write-Host "Lanzando JoyArk ahora..."
          $joyPath = "C:\Program Files (x86)\JoyArk\JoyArk.exe"
          if (Test-Path $joyPath) {
              # Inicia el proceso y lo deja corriendo
              Start-Process -FilePath $joyPath
              Write-Host "¡LISTO! Conéctate ahora. JoyArk te está pidiendo el correo."
          } else {
              Write-Host "Error: No se encontró la ruta de JoyArk."
          }
          
          # Bucle para que no se cierre la máquina (6 horas)
          $i = 0
          while ($i -lt 360) {
            Start-Sleep -Seconds 60
            $i++
          }
          
